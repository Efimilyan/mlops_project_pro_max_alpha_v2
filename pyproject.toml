[project]
name = "sop-search"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.16.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "transformers>=5.24.1",
    "tritonclient[http]==2.75.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
