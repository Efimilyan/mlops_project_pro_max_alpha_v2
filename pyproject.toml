[project]
name = "sop-search"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tritonclient[http]==2.75.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
